; FF7 SpellExt - character file: new party members
; EXAMPLE ONLY: everything below is commented out, so this file defines nothing.
; To use a section, remove the ';' at the start of each of its lines and change the values.
; Every key is explained in Readme\FF7_SpellExt_Characters_README.txt. Mistakes are reported in FF7_SpellExt.log
; (beside ff7_en.exe) with the file and line number.
;
; FF7 SpellExt - new party member. See Readme/FF7_SpellExt_Characters_README.txt.
; A save made with the new character in the party needs the DLL and this
; file to load correctly.

#[12]
#name         = Newcomer
#keep_seat    = yes          ; always seated: their seat is never given to another character, similar to the main cast
;
; ---- Looks and borrowed assets -------------------------------------------
#portrait     = newcomer     ; newcomer.png >> put in SpellExtConfig\files\portrait\newcomer.png will auto-make newcomer_l.png
#battle_like  = vincent      ; whose place in the game's list of battle models it takes; its own model comes from battle_files
#field_model  = YUAA         ; their field skeleton (yuaa.hrc in the mod's char folder)
#battle_files = za           ; its own model files: zaaa, zaab ... under SpellExtConfig\files
#limits       = cloud
#equip_like   = vincent      ; may equip whatever Vincent can

; ---- Growth: the value wanted at each of these levels ---------------------
;              at level:  1   11   21   31   41   51   61   81   99
#strength     =           12   22   33   45   55   62   68   78   84
#vitality     =           10   20   31   42   50   57   63   73   78
#magic        =           13   25   38   52   62   71   79   90   96
#spirit       =           11   23   35   48   60   69   77   89   95
#dexterity    =            6   14   21   29   37   43   48   52   55
#luck         =           14   16   17   18   20   22   23   24   25
#hp           =          190  390  830 1550 2450 3550 4800 7200 8900
#mp           =           20   85  165  255  355  455  600  770  910

; Experience needed, one number per level band (1-10, 11-20, 21-30, 31-40,
; 41-50, 51-60, 61-80, 81-99). Higher = slower levelling. The nine use 68-77.
#exp_rate     = 70 72 75 76 76 76 76 76

; ---- Starting record (used when the character is first created) -----------
#level        = cloud           ; stats, HP, MP and experience follow from the growth above (same level as cloud on init)
#weapon       = 322          ;
#armour       = 384          ;
#accessory    = none
; Materia starts with: one entry per slot, in slot order. An entry is a materia ID, ID:AP,
; ID:master, or none for an empty slot. Remove the leading ; to use a line.
; (49 Fire, 50 Ice, 52 Lightning, 53 Restore, 54 Heal, 23 All, 1 HP Plus; 96 upward are yours from the materia file.)
#weapon_materia = 49:2000, 23, none, 53:master    ; Fire with 2000 AP, All, an empty slot, a mastered Restore
#armour_materia = 1                               ; HP Plus in the armour's first slot
#weapon_materia = 49:2000, 23:1000
#armor_materia = none

; ---- Joining ---------------------------------------------------------------
; join = script (default): created when a field script adds character 12.
; party_slot is a testing aid: create on load and put into this party slot.
#party_slot   = 3
#remake_on_load = yes       ; TESTING: rebuild her from this sheet at every load, ignoring what the save holds.
;                            Needed to see a change to the starting record on a save that already has her.
