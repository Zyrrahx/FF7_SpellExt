; FF7 SpellExt - limits file: limit breaks of the new characters
; EXAMPLE ONLY: everything below is commented out, so this file defines nothing.
; To use a section, remove the ';' at the start of each of its lines and change the values.
; Every key is explained in Readme\FF7_SpellExt_Limits_README.txt. Mistakes are reported in FF7_SpellExt.log
; (beside ff7_en.exe) with the file and line number.
;
; Needs a character of the character file. A character with a section here has ONLY the limits defined here.
; [12]
; gauge = 140 324 435 506     ; how slowly the gauge fills at limit levels 1-4 (Cloud's values)
; [12 1-1]
; name        = Quick Slash
; description = A fast single cut
; base        = 128           ; Braver: its animation and effect
; effect      = base
; strength    = 40
;
; A transformation (see "Transformations" in the readme): a limit that turns its user into a FORM, a battle
; model defined once in its own section. Here an enemy's own model, with a script file of the form's own in
; the party layout (74 scripts), supplied in the mod's battle folder or SpellExtConfig\files.
; [form myform]
; model_enemy  = 331          ; the model: enemy 331's own files (mt..)
; model_script = ZOAB         ; its script file, rebuilt in the party layout
; weapon       = no
; [12 2-1]
; name           = My Transformation
; base           = 173        ; a game transformation: additional effect 3, target the user, no damage
; form           = myform
; effect         = none
; animation_pack = none
; script         = ac 00 fc 00 e0 ea f4 19 f3 d8 01 29 00 e2 c5 f3 c9 f4 01 f3 ca a2 11 f1
