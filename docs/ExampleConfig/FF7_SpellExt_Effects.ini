; FF7 SpellExt - effects file: effect copies (a game effect with files of your own)
; EXAMPLE ONLY: everything below is commented out, so this file defines nothing.
; To use a section, remove the ';' at the start of each of its lines and change the values.
; Every key is explained in Readme\FF7_SpellExt_Effects_README.txt. Mistakes are reported in FF7_SpellExt.log
; (beside ff7_en.exe) with the file and line number.
;
; A section is the copy's own effect number, 0x100 to 0xffff. A spell plays it with
;   animation = 0x100       (in FF7_SpellExt_Spells.ini; animation_all takes a copy too)
;
; copy = the magic effect copied (0x05-0x35; the readme lists which can be copied and their files)
; file = FROM:TO   one of the effect's files and the name loaded in its place. Keep the extension:
;                  .TIM is supplied as .TEX and .SPT as .S (YFIRE00.TIM -> the file YFIRE00.TEX).
; The files go in the mod's magic folder (FFNx / 7th Heaven) or SpellExtConfig\files (the game's own
; driver). A new file is seen after the game is restarted.

; A blue Fire: Fire's two textures recoloured, its sprite file copied under a new name.
; [effect 0x100]
; copy = 0x1b                         ; Fire
; file = FIRE00.TIM:YFIRE00.TIM       ; supply YFIRE00.TEX
; file = FI_A01.SPT:YFI_A01.SPT       ; supply YFI_A01.S
; file = FIRE01.TIM:YFIRE01.TIM       ; supply YFIRE01.TEX

; A green Bolt, only its first texture changed.
; [effect 0x101]
; copy = 0x21                         ; Bolt
; file = THUNDE00.TIM:GBOLT00.TIM     ; supply GBOLT00.TEX
