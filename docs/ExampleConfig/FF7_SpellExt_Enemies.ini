; FF7 SpellExt - enemies file: which enemy folders and scene files count, and which battle of the game
; becomes a battle of one of your scenes
; EXAMPLE ONLY: everything below is commented out, so this file defines nothing.
; To use a section, remove the ';' at the start of each of its lines and change the values.
; Every key is explained in Readme\FF7_SpellExt_Enemies_README.txt. Mistakes are reported in FF7_SpellExt.log
; (beside ff7_en.exe), each line starting with "enemies:".
;
; Read at start-up and at "Re-init .ini files", and only with enemies = on in FF7_SpellExt_Game.ini.
; The file is optional: without it every folder of SpellExtConfig\enemies and every scene file of
; SpellExtConfig\scenes counts, and no battle of the game is replaced.
;
; [enemies]
; load = all                       ; or folder names of SpellExtConfig\enemies, comma or space separated
;
; [scenes]
; load = all                       ; or scene file names of SpellExtConfig\scenes, without .ini
;
; [battle_map]                     ; where : the game's battle = your battle (1024 to 16383)
; field 123 : 268 = 1200           ; in field 123 the game's battle 268 becomes battle 1200 (scene 300, formation 0)
; world : 140 = 1204               ; on the world map
; any : 16 = 1028                  ; anywhere (a line for the place wins over an any line)
;
; [models]                         ; a testing aid: model 365 from enemies\my_enemy\model\ in EVERY battle
; 365 = my_enemy
;
; [attack 0x1b]                    ; an attack ID in ANY battle: every enemy's Fire (kernel 1b)
; effect = 0x210                   ;   plays native effect 0x210 of FF7_SpellExt_Effects.ini,
; effect_all = 0x211               ;   0x211 when it has results on several targets,
; camera = 0x1a0                   ;   with camera 0x1a0
