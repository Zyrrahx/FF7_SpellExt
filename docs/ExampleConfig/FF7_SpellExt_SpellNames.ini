; FF7 SpellExt - spell names: renames the game's own spells
; EXAMPLE ONLY: everything below is commented out, so this file defines nothing.
; To use a section, remove the ';' at the start of each of its lines and change the values.
; Every key is explained in Readme\FF7_SpellExt_SpellNames_README.txt. Mistakes are reported in FF7_SpellExt.log
; (beside ff7_en.exe) with the file and line number.
;
; The number decides; the left name is the game's own, the right one is shown. Same name = no change.
; NOTE: other mods that rename spells (New Threat, for one) are overwritten by a line here.
; [Magic]
; 0x01  Cure2                = Cura         ; Restores HP
; 0x02  Cure3                = Curaga       ; Restores HP
